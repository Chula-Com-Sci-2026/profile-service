openapi: 3.1.0

info:
  title: Profile Service
  version: 1.0.0
  summary: Runner profiles for Can't Run Alone.
  description: |
    The HTTP contract for Profile Service. Derived from `domain.md`, which is
    authoritative: this file maps its four operations onto one resource, and adds
    two operational endpoints the model knows nothing about, and the avatar upload
    handshake, which exists because the image lives in object storage rather than here.

    The Identity Service assigns the `userId`, so a client knows the URI before
    the profile exists — which is why creation is a `PUT` rather than a `POST`
    to a collection. There is no collection: profiles cannot be listed or
    searched (domain.md §3).

    Text fields are trimmed before the length rules apply, so a value of only
    whitespace is rejected as empty.

security:
  - bearerAuth: []

paths:
  /v1/profiles/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: >-
          The Identity Service's id for a runner. The bounds describe a valid id; they are not
          a rejection. A value outside them is not refused here — it simply matches no profile,
          so read, change and delete answer 404, while create fails on the same §4 rule as any
          other bad field and answers 422.
        schema: { type: string, minLength: 1, maxLength: 64 }

    put:
      operationId: createProfile
      summary: Create a runner's profile
      description: Create only. The server answers 409 if a profile already exists — one profile per runner. Use PATCH to change one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileWrite' }
      responses:
        '201': { $ref: '#/components/responses/Profile' }
        '400': { $ref: '#/components/responses/Problem' }   # body is malformed or has an unknown field
        '401': { $ref: '#/components/responses/Problem' }   # no token, or it does not verify
        '403': { $ref: '#/components/responses/Problem' }   # a runner may only create their own profile
        '409': { $ref: '#/components/responses/Problem' }   # a profile already exists
        '422': { $ref: '#/components/responses/Problem' }   # a value breaks a rule in domain.md §4
        default: { $ref: '#/components/responses/Problem' }

    get:
      operationId: getProfile
      summary: Read a runner's profile
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '401': { $ref: '#/components/responses/Problem' }   # no token, or it does not verify
        '404': { $ref: '#/components/responses/Problem' }   # no profile for that userId
        default: { $ref: '#/components/responses/Problem' }

    patch:
      operationId: updateProfile
      summary: Change a runner's profile
      description: RFC 7396 merge patch. `userId` never changes.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '400': { $ref: '#/components/responses/Problem' }   # body is malformed or has an unknown field
        '401': { $ref: '#/components/responses/Problem' }   # no token, or it does not verify
        '403': { $ref: '#/components/responses/Problem' }   # only the owner may change a profile
        '404': { $ref: '#/components/responses/Problem' }   # no profile for that userId
        '422': { $ref: '#/components/responses/Problem' }   # a value breaks a rule in domain.md §4
        default: { $ref: '#/components/responses/Problem' }

    delete:
      operationId: deleteProfile
      summary: Delete a runner's profile, permanently
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }   # no token, or it does not verify
        '403': { $ref: '#/components/responses/Problem' }   # only the owner may delete a profile
        '404': { $ref: '#/components/responses/Problem' }   # no profile for that userId
        default: { $ref: '#/components/responses/Problem' }

  /v1/profiles/{userId}/avatar-uploads:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }

    post:
      operationId: createAvatarUpload
      summary: Create an upload for a new avatar
      description: >-
        Creates an upload: a short-lived URL the client PUTs the image to directly, and the key
        that upload will occupy. The resource is the *permission*, not the avatar — which is why
        the path is `avatar-uploads` and why nothing here accepts image bytes. The service never
        handles them; it is an API, not a file server.

        It does not change the profile. Once the upload succeeds, PATCH `avatarRef` with the key
        returned here; until then the profile is untouched, so a failed upload leaves nothing
        pointing at an object that does not exist. Setting the field is `updateProfile`'s job and
        stays that way.
      responses:
        '201':
          description: An upload is authorised
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uploadUrl, avatarRef, expiresInSeconds]
                properties:
                  uploadUrl:
                    type: string
                    description: PUT the image here. Expires — ask again rather than storing it.
                  avatarRef:
                    type: string
                    maxLength: 128
                    description: The key the upload will occupy. Send it back as `avatarRef`.
                  expiresInSeconds: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Problem' }   # no token, or it does not verify
        '403': { $ref: '#/components/responses/Problem' }   # a runner may only upload their own
        '404': { $ref: '#/components/responses/Problem' }   # no profile for that userId
        default: { $ref: '#/components/responses/Problem' }

  /health:
    get:
      operationId: health
      summary: Liveness probe
      security: []   # open: an orchestrator has no token
      description: >-
        200 while the process is running. It does not check the database — restarting this
        service cannot fix a database outage — and it stays 200 during a graceful shutdown,
        because a failing liveness probe tells an orchestrator to restart, which is the wrong
        answer to a deliberate drain. Use /ready to decide whether to send traffic.
        Unversioned on purpose: an operational endpoint, not part of the profile API.
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /ready:
    get:
      operationId: readiness
      summary: Readiness probe
      security: []   # open: a load balancer has no token
      description: >-
        Whether this instance can serve right now. Unlike /health it does check the database,
        because the answer to "do not send me traffic" is to route elsewhere, not to restart.
        It answers 503 while shutting down and while the database is unreachable. A failing
        readiness probe should remove the instance from rotation and nothing more.
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: Not serving — shutting down, or the database is out of reach
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [draining, unavailable] }

  /docs:
    get:
      operationId: documentation
      summary: This contract, rendered
      security: []   # open: it is documentation, and no token can be minted locally anyway
      description: >-
        Swagger UI for the document you are reading. Served by the service itself so the page
        can never describe a different version than the one running, and served from assets
        bundled in the image rather than a CDN so it works with no network. Its JavaScript and
        CSS come from /docs/{asset}, which is a file server and not part of this API.
      responses:
        '200':
          description: The documentation page
          content:
            text/html: {}

  /openapi.yaml:
    get:
      operationId: contract
      summary: This contract, as a file
      security: []   # open: same reason as /docs
      description: >-
        The document itself, for tooling — a client generator, a diff in review, or a second
        renderer. Byte-for-byte the docs/openapi.yaml this service was built from.
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/yaml: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A JWT issued by the Identity Service and verified locally on every request — not
        trusted because a gateway forwarded it. Its subject is the caller's `userId`, and the
        403 responses below compare it against the `userId` in the path. Ownership is an access
        rule of this contract; domain.md is silent on who may act.

  responses:
    Profile:
      description: The profile
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Profile' }

    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ProfileFields:
      type: object
      description: >-
        The writable fields. An unset scalar is absent, never null; an unset set is empty.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio:         { type: string, maxLength: 500 }
        avatarRef:   { type: string, maxLength: 128, description: A key to the image in this service's object storage. Storage is not implemented yet. }
        birthYear:   { type: integer, minimum: 1900, description: Not later than the current year. }
        gender:      { $ref: '#/components/schemas/Gender' }
        area:        { $ref: '#/components/schemas/Area' }
        pace:        { type: integer, minimum: 150, maximum: 900, description: Seconds per kilometre. }
        volume:      { type: integer, minimum: 0, maximum: 500000, description: Metres per week. }
        experience:  { $ref: '#/components/schemas/Experience' }
        preferredDistances:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Distance' }
        preferredRunTimes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RunTime' }

    Profile:
      description: >-
        What a response always contains. `required` here means present on the wire,
        not that the runner had to answer — see `ProfileWrite` for what a client must send.
      allOf: [{ $ref: '#/components/schemas/ProfileFields' }]
      required: [userId, displayName, birthYear, preferredDistances, preferredRunTimes]
      unevaluatedProperties: false
      properties:
        userId: { type: string, minLength: 1, maxLength: 64 }

    ProfilePatch:
      description: >-
        A merge patch (RFC 7396). An absent key is untouched; null clears the field.
        `displayName` and `birthYear` cannot be cleared — a profile cannot exist without
        them. A set is replaced by sending a new array, never by sending null.
      type: object
      unevaluatedProperties: false
      properties:
        displayName: { $ref: '#/components/schemas/ProfileFields/properties/displayName' }
        birthYear:   { $ref: '#/components/schemas/ProfileFields/properties/birthYear' }
        bio:         { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/bio' },        { type: 'null' }] }
        avatarRef:   { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/avatarRef' },  { type: 'null' }] }
        gender:      { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/gender' },     { type: 'null' }] }
        area:        { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/area' },       { type: 'null' }] }
        experience:  { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/experience' }, { type: 'null' }] }
        pace:        { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/pace' },       { type: 'null' }] }
        volume:      { oneOf: [{ $ref: '#/components/schemas/ProfileFields/properties/volume' },     { type: 'null' }] }
        preferredDistances: { $ref: '#/components/schemas/ProfileFields/properties/preferredDistances' }
        preferredRunTimes:  { $ref: '#/components/schemas/ProfileFields/properties/preferredRunTimes' }

    ProfileWrite:
      description: No `userId` in the body — it is the path parameter.
      allOf: [{ $ref: '#/components/schemas/ProfileFields' }]
      required: [displayName, birthYear]
      unevaluatedProperties: false

    Gender:     { type: string, enum: [male, female, non_binary] }
    Area:       { type: string, enum: [lumphini, benchakitti, chatuchak] }
    Experience: { type: string, enum: [beginner, intermediate, advanced] }
    Distance:   { type: string, enum: ['5k', '10k', half_marathon, marathon] }

    RunTime:
      type: object
      additionalProperties: false
      required: [dayOfWeek, timeOfDay]
      properties:
        dayOfWeek: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        timeOfDay:
          type: string
          enum: [early_morning, morning, midday, afternoon, evening, night]
          description: >-
            Bangkok local time (UTC+7). early_morning 05:00–08:00 · morning 08:00–11:00 ·
            midday 11:00–14:00 · afternoon 14:00–17:00 · evening 17:00–20:00 · night 20:00–05:00

    Problem:
      type: object
      required: [title, status]
      properties:
        title:  { type: string }
        status: { type: integer }
        detail: { type: string, description: 'Human prose, for people. Do not parse.' }
