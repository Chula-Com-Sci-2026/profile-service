services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
      POSTGRES_DB: profile
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile -d profile"]
      interval: 2s
      timeout: 3s
      retries: 15

  # MinIO speaks the S3 API, so the same code runs against real S3 by changing an endpoint —
  # the dependency is on a protocol, not a vendor. AGPL v3, so the tag is pinned rather than
  # tracking latest: a licence change arriving silently on `docker compose pull` is not a
  # surprise anyone wants.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Provisioning, not application logic: the bucket exists before the service needs it, and it
  # is readable anonymously because an avatar is a picture a runner chose to show other runners.
  # Keys carry a uuid, so the URL is unguessable even though the bucket is open — which only
  # holds if the keys cannot be listed. `mc anonymous set download` grants s3:ListBucket as well
  # as s3:GetObject, so an anonymous request could enumerate every key and with it every runner
  # who has an avatar. The policy below grants s3:GetObject and nothing else.
  #
  # Named for the service, not for what is in it. Keys are `avatars/{userId}/{uuid}`, and a
  # bucket also called `avatars` makes every path-style URL read /avatars/avatars/… — and
  # leaves nowhere to put anything this service might store later.
  create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/public-read.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::profile-service/*"]
            }
          ]
        }
        JSON
        mc alias set store http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing store/profile-service
        mc anonymous set-json /tmp/public-read.json store/profile-service

  # Same image as the service, different command, run once and gone. Never on the service's
  # boot: three replicas starting together would be three migrations against one schema.
  migrate:
    image: profile-service:local
    build: .
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://profile:profile@postgres:5432/profile
    depends_on:
      postgres:
        condition: service_healthy

  profile-service:
    image: profile-service:local
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://profile:profile@postgres:5432/profile
      # No Identity Service runs here, so /v1 answers 401 while /health and /ready work.
      # The value only has to be present at startup; it is fetched when a token arrives.
      IDENTITY_JWKS_URL: http://identity:4000/.well-known/jwks.json
      IDENTITY_ISSUER: http://identity:4000
      LOG_LEVEL: info
      # /ready answers 503 for this long before the server stops accepting.
      SHUTDOWN_DRAIN_MS: "3000"
      # Two endpoints, deliberately: a presigned URL is signed over its host, so one is how the
      # service reaches MinIO and the other is how a browser does.
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: profile-service
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
    # Must exceed SHUTDOWN_DRAIN_MS plus the close deadline, or the container is killed
    # mid-drain and the graceful shutdown is worse than none. 3s + 10s, with room.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      create-bucket:
        condition: service_completed_successfully
