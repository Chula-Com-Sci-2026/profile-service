services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
      POSTGRES_DB: profile
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile -d profile"]
      interval: 2s
      timeout: 3s
      retries: 15

  # MinIO speaks the S3 API, so the same code runs against real S3 by changing an endpoint —
  # the dependency is on a protocol, not a vendor. MinIO stopped publishing images in October
  # 2025 and quay.io no longer serves its old tags, so this is Chainguard's build, as the team's
  # integration stack runs. Pinned by digest rather than tracking latest: MinIO is AGPL v3, and a
  # licence change arriving silently on `docker compose pull` is not a surprise anyone wants.
  # The image declares no volume, unlike MinIO's own, so /data is one here: a recreate keeps the
  # photos, `db:reset` does not.
  minio:
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Provisioning, not application logic: the bucket exists before the service needs it, and it
  # is readable anonymously because a photo is a picture a runner chose to show other runners.
  # Keys carry a uuid, so the URL is unguessable even though the bucket is open — which only
  # holds if the keys cannot be listed. `mc anonymous set download` grants s3:ListBucket as well
  # as s3:GetObject, so an anonymous request could enumerate every key and with it every runner
  # who has a photo. The policy below grants s3:GetObject and nothing else.
  #
  # Named for the service, not for what is in it. Keys are `photos/{id}/{uuid}`, and a
  # bucket also called `photos` makes every path-style URL read /photos/photos/… — and
  # leaves nowhere to put anything this service might store later.
  #
  # The MinIO image carries `mc` and `sh`, so the job runs on it too: one image to pin.
  create-bucket:
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/public-read.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::profile-service/*"]
            }
          ]
        }
        JSON
        mc alias set store http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing store/profile-service
        mc anonymous set-json /tmp/public-read.json store/profile-service

  # The team's broker and image (ADR-0021). Profile publishes ProfileUpdated to its `cra.events`
  # exchange; nothing here consumes it, so until a consumer binds a queue the events wait,
  # unroutable, in the outbox. The admin login is a development value, for the management UI
  # (http://localhost:15672) and the one-shot below; Profile itself never uses it.
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Provisioning, like create-bucket: Profile's own broker user (B11), with the least it needs.
  # configure and write on `cra.events` only, read on nothing — configure because Profile declares
  # the exchange itself on every connect, write because it publishes there, and nothing else.
  # The image's own rabbitmqadmin talks to the management API, which may answer a little after
  # the broker reports healthy, so it asks until it does. `$$` because compose interpolates `$`.
  create-broker-user:
    image: rabbitmq:4.3.6-management
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        admin="rabbitmqadmin --host rabbitmq --username admin --password admin"
        tries=0
        until $$admin show overview > /dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 60 ]; then echo "the management API never answered" >&2; exit 1; fi
          sleep 1
        done
        $$admin declare user --name profile --password profile --tags ''
        $$admin declare permissions --vhost / --username profile --configure '^cra\.events$$' --write '^cra\.events$$' --read '^$$'

  # Same image as the service, different command, run once and gone. Never on the service's
  # boot: three replicas starting together would be three migrations against one schema.
  migrate:
    image: profile-service:local
    build: .
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://profile:profile@postgres:5432/profile
    depends_on:
      postgres:
        condition: service_healthy

  profile-service:
    image: profile-service:local
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://profile:profile@postgres:5432/profile
      # Identity's development secret (its config.env.example), so a token a local Identity signs
      # verifies here, and so does one you sign yourself (README). JWT_ISSUER and JWT_AUDIENCE keep
      # the team's defaults.
      ACCESS_TOKEN_SECRET: replace-with-local-access-signing-secret
      LOG_LEVEL: info
      # /ready answers 503 for this long before the server stops accepting.
      SHUTDOWN_DRAIN_MS: "3000"
      # Two endpoints, deliberately: a presigned URL is signed over its host, so one is how the
      # service reaches MinIO and the other is how a browser does.
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: profile-service
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      # Profile events go from the outbox to RabbitMQ, as Profile's own broker user. Startup never
      # waits on the broker — it is not in depends_on — so RabbitMQ down costs delivery and nothing
      # else; the events wait in the outbox until it is back.
      EVENT_SENDER: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: profile
      RABBITMQ_PASSWORD: profile
    # Must exceed SHUTDOWN_DRAIN_MS plus the close deadline, or the container is killed
    # mid-drain and the graceful shutdown is worse than none. 3s + 10s, with room.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      create-bucket:
        condition: service_completed_successfully
