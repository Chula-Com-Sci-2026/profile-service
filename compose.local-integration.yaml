# Profile for the team's local-integration stack: its own PostgreSQL, MinIO and bucket, its own
# broker user, the migration, the service and an optional seed.
#
# 1. Remove local-integration's own Profile service. Left in, compose merges it into this one
#    (same name) or both answer to the same name. If other services list it under depends_on,
#    change those entries to profile-service.
# 2. Fill in the values below.
# 3. Copy this file next to local-integration's compose file. Run with every -f file you already
#    use (compose.override.yaml too, if you have one) and this one last, for example:
#      docker compose -f compose.yaml -f compose.team-identity.yaml -f compose.local-integration.yaml up --build
# 4. Optional: load the sample runners (Ray, Mali and five more, without photos). It empties
#    Profile first. Use the same -f files:
#      docker compose -f compose.yaml -f compose.team-identity.yaml -f compose.local-integration.yaml run --rm --build profile-seed
#
#   service-name           the name the gateway and Buddy Discovery dial for Profile
#   port                   the port they dial it on
#   broker-host            local-integration's RabbitMQ service
#   broker-admin-user,     a login that can create users through the management API (port 15672),
#   broker-admin-password  used once to create Profile's own user
#   access-token-secret    Identity's ACCESS_TOKEN_SECRET
#   checkout               an absolute path to a profile-service checkout
#
# MinIO is published on 127.0.0.1:9000. Set PROFILE_PHOTO_PORT if 9000 is taken.
x-profile:
  service-name: &service-name profile-service
  port: &port "3000"
  broker-host: &broker-host rabbitmq
  broker-admin-user: &broker-admin-user guest
  broker-admin-password: &broker-admin-password guest
  access-token-secret: &access-token-secret replace-with-local-access-signing-secret
  checkout: &checkout .

services:
  # Profile's own database.
  profile-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
      POSTGRES_DB: profile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile -d profile"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Photos. Published on 127.0.0.1 only, because the browser loads photos from the host.
  profile-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${PROFILE_PHOTO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The bucket: anyone can read a photo by its address, but no one can list them.
  profile-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      profile-minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/public-read.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::profile-service/*"]
            }
          ]
        }
        JSON
        mc alias set store http://profile-minio:9000 minioadmin minioadmin
        mc mb --ignore-existing store/profile-service
        mc anonymous set-json /tmp/public-read.json store/profile-service

  # Profile's own broker user: configure and write on `cra.events` only. `$$` escapes `$`.
  profile-create-broker-user:
    image: rabbitmq:4.3.6-management
    restart: "no"
    environment:
      BROKER_HOST: *broker-host
      BROKER_ADMIN_USER: *broker-admin-user
      BROKER_ADMIN_PASSWORD: *broker-admin-password
    entrypoint:
      - sh
      - -c
      - |
        admin="rabbitmqadmin --host $$BROKER_HOST --username $$BROKER_ADMIN_USER --password $$BROKER_ADMIN_PASSWORD"
        tries=0
        until $$admin show overview > /dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 120 ]; then echo "the broker's management API never answered" >&2; exit 1; fi
          sleep 1
        done
        $$admin declare user --name profile --password profile --tags ''
        $$admin declare permissions --vhost / --username profile --configure '^cra\.events$$' --write '^cra\.events$$' --read '^$$'

  # Runs the migrations once, before the service starts.
  profile-migrate:
    image: profile-service:local
    build:
      context: *checkout
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://profile:profile@profile-postgres:5432/profile
    depends_on:
      profile-postgres:
        condition: service_healthy

  # Profile. Its port stays internal; the gateway and Buddy Discovery reach it by name.
  profile-service:
    image: profile-service:local
    build:
      context: *checkout
    networks:
      default:
        aliases: [*service-name]
    environment:
      PORT: *port
      DATABASE_URL: postgres://profile:profile@profile-postgres:5432/profile
      ACCESS_TOKEN_SECRET: *access-token-secret
      LOG_LEVEL: info
      SHUTDOWN_DRAIN_MS: "3000"
      OBJECT_STORAGE_ENDPOINT: http://profile-minio:9000
      # Never `localhost`, which a browser may try as IPv6 first: MinIO listens on 127.0.0.1 only.
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${PROFILE_PHOTO_PORT:-9000}
      OBJECT_STORAGE_BUCKET: profile-service
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      EVENT_SENDER: rabbitmq
      RABBITMQ_HOST: *broker-host
      RABBITMQ_USER: profile
      RABBITMQ_PASSWORD: profile
    # Must exceed SHUTDOWN_DRAIN_MS plus the ten-second close deadline.
    stop_grace_period: 20s
    depends_on:
      profile-postgres:
        condition: service_healthy
      profile-migrate:
        condition: service_completed_successfully

  # Step 4's seed, run only by name: it empties Profile's table first. Photos are skipped, because
  # an upload link names 127.0.0.1, which inside a container is the container itself.
  profile-seed:
    profiles: [seed]
    build:
      context: *checkout
      target: build
    command: ["node", "scripts/seed.ts"]
    environment:
      DATABASE_URL: postgres://profile:profile@profile-postgres:5432/profile
      OBJECT_STORAGE_ENDPOINT: http://profile-minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${PROFILE_PHOTO_PORT:-9000}
      OBJECT_STORAGE_BUCKET: profile-service
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
    depends_on:
      profile-migrate:
        condition: service_completed_successfully
